{
  "options": {
    "config_plugin": "filesystem",
    "logger_plugin": "filesystem",
    "logger_path": "/var/log/osquery",
    "schedule_splay_percent": "10",
    "utc": "true",
    "host_identifier": "hostname"
  },
  "schedule": {
    "processes": {
      "query": "SELECT pid, name, path, cmdline, uid, start_time FROM processes;",
      "interval": 60,
      "description": "Full process snapshot every 60s; diff rows surface new/exited processes."
    },
    "listening_ports": {
      "query": "SELECT pid, port, protocol, address, family FROM listening_ports;",
      "interval": 60,
      "description": "Listening sockets every 60s; expected set is exactly the telemetry-plane ports (1514, 3100, 4317, 9090, 9096, 9464, 14317, 16686)."
    },
    "telemetry_binary_integrity": {
      "query": "SELECT path, sha256, mtime FROM hash WHERE path IN ('/opt/aether/bin/aether-collect', '/opt/aether/lib/libaether.so', '/opt/aether/bin/jaeger-all-in-one');",
      "interval": 300,
      "description": "Re-hash telemetry binaries every 5m; any drift vs. HASHES.sha256 is a Layer 6 integrity alert."
    },
    "file_events_telemetry": {
      "query": "SELECT target_path, category, action, uid, time FROM file_events;",
      "interval": 30,
      "description": "FIM event stream for watched paths (see file_paths below)."
    }
  },
  "file_paths": {
    "aether_install": [
      "/opt/aether/%%"
    ],
    "telemetry_configs": [
      "/etc/prometheus/%%",
      "/etc/loki/%%",
      "/etc/otelcol-contrib/%%",
      "/etc/osquery/%%",
      "/etc/grafana/provisioning/%%"
    ]
  },
  "packs": {}
}
