<!-- ==========================================================================
     AetherOS Telemetry Plane — Layer 6: Wazuh agent (ossec.conf snippet)
     Agent -> manager in the SAME guest (OI-3): manager address is loopback.
     Pinned: wazuh-agent 4.11.0 (see VERSIONS.md)
     Install: append/merge into /var/ossec/etc/ossec.conf inside the guest.
     ========================================================================== -->
<ossec_config>
  <client>
    <server>
      <!-- Manager runs in-guest (see INTEGRATION.md); loopback only. -->
      <address>127.0.0.1</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <!-- File Integrity Monitoring: AetherOS install tree + all committed
       telemetry-plane configs. Realtime so drift is seen within seconds. -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/aether</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/aether/telemetry</directories>
    <directories check_all="yes" realtime="yes">/etc/prometheus</directories>
    <directories check_all="yes" realtime="yes">/etc/loki</directories>
    <directories check_all="yes" realtime="yes">/etc/otelcol-contrib</directories>
    <directories check_all="yes" realtime="yes">/etc/osquery</directories>
    <directories check_all="yes" realtime="yes">/etc/grafana/provisioning</directories>

    <!-- Never watch volatile telemetry state — only config and binaries. -->
    <ignore>/var/lib/loki</ignore>
    <ignore>/var/lib/prometheus</ignore>
    <ignore>/var/lib/grafana</ignore>
  </syscheck>

  <!-- Rootkit / policy baseline checks for the guest. -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>600</frequency>
  </rootcheck>

  <!-- Local alerting stays in JSON so the SEB bridge can tail it. -->
  <logging>
    <log_format>json</log_format>
  </logging>
</ossec_config>
