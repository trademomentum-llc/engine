name: NNOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake openssl

      - name: Configure (MinSizeRel)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)

      - name: Build all daemon targets
        run: cmake --build build --parallel

      - name: Verify float-free C++ source
        run: ./scripts/verify_float_free.sh

      - name: Smoke test all daemons
        run: ./scripts/smoke_test_all.sh

      - name: Verify binary provenance manifest
        run: |
          test -f build/provenance/sha256sums.txt
          wc -l build/provenance/sha256sums.txt

  jmk-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AArch64 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-aarch64 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # The JStar compiler lives in a separate repository. In a full CI setup
      # it should be checked out as a sibling of this workspace.
      - name: Build JStar compiler
        run: |
          cd ../apps
          cargo build --release

      - name: Build AArch64 micro-kernel
        run: |
          cd nnos/neurodios/jasterish-microkernel
          make ARCH=aarch64 clean
          make ARCH=aarch64 build

      - name: AArch64 smoke test
        run: |
          cd nnos/neurodios/jasterish-microkernel
          ./scripts/smoke_aarch64.sh
